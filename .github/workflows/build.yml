name: Build and validate plugin
on:
  push:
  workflow_dispatch:
jobs:
 build-phar:
   name: Build and validate plugin
   runs-on: ubuntu-latest
   steps:
     - name: Check out repository
       uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
     - name: Set up PHP environment
       uses: pmmp/setup-php-action@3c38c259834f945351a662392836d90eb08abff0
       with:
         php-version: 8.3
         install-path: "./bin"
         pm-version-major: 5

     - name: Install Composer dependencies
       run: composer install --prefer-dist

     - name: Run PHP-CS-Fixer on source files
       run: ./vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.php --verbose

     - name: Build plugin PHAR
       run: "composer run-script build"

     - name: Upload plugin PHAR artifact
       uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
       with:
         name: LibVapmPMMP
         path: LibVapmPMMP.phar
     - name: Clean up workspace after artifact upload
       run: "rm -rf *"
